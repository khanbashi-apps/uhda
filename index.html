.sp-sq{animation:spFade .35s ease-out .85s both}
.sp-cardo{stroke-dasharray:416;stroke-dashoffset:416;animation:spD416 .7s ease-in-out .3s forwards,spOut .3s ease 1.15s forwards}
.sp-card{animation:spFade .35s ease-out 1s both}
.sp-k .sp-ln{transform-origin:right center;animation:spGrow .3s ease-out both}
.sp-k .sp-l1{animation-delay:1.15s}
.sp-k .sp-l2{animation-delay:1.25s}
.sp-k .sp-l3{animation-delay:1.35s}

.sp-bado{stroke-dasharray:170;stroke-dashoffset:170;animation:spD170 .4s ease-in-out 1.3s forwards,spOut .2s ease 1.75s forwards}
.sp-badge{animation:spPop .35s cubic-bezier(.3,1.5,.5,1) 1.65s both}

.sp-name{animation:spUp .5s ease-out 2s both}

@keyframes spD712{to{stroke-dashoffset:0}}
@keyframes spD416{to{stroke-dashoffset:0}}
@keyframes spD170{to{stroke-dashoffset:0}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spOut{to{opacity:0}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes spGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spPop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}

.cthumb{width:46px;height:46px;border-radius:13px;overflow:hidden;display:grid;place-items:center;background:var(--card2);color:var(--acc)}
.ctname{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile.addt{border:1.5px dashed var(--acc);background:transparent;box-shadow:none;color:var(--acc)}
.ctile.addt .ctname{font-weight:600}
.ctile.addt .cthumb{background:transparent;border:1.5px dashed var(--acc)}
.ctdot{position:absolute;top:8px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%}
.bkcard{display:flex;flex-direction:column;gap:12px}
.bkhead{display:flex;align-items:flex-start;gap:12px}
.rgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:start}
.rgrid:last-child{border-bottom:0}
.rgrid.h{font-size:11px;color:var(--mute);font-weight:600;padding-top:4px}
.rspec{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.5}
.lrow.flash{animation:rowFlash 2.2s ease-out}
@keyframes rowFlash{0%,35%{background:var(--gS)}100%{background:transparent}}
.alertbox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--rS);color:var(--r)}
.alertbox.muted{background:var(--nS);color:var(--n)}
.alertbox.soon{background:var(--oS);color:var(--o)}
.alertbox .at{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;line-height:1.5}
.abtns{display:flex;flex-wrap:wrap;gap:8px}
.abtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid currentColor;font-size:13px;font-weight:600;background:var(--card)}
.hthumb{flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line);display:block}
.hthumb img{width:100%;height:100%;object-fit:cover;display:block}
.notifrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.stp{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.7}
.stp b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--accInk);font-size:12px}
.sheet>*,.sheet>sc-if>*,.sheet>sc-if>sc-if>*{flex-shrink:0}
.dlgwrap{position:absolute;inset:0;z-index:45;display:grid;place-items:center;padding:24px}
.dlg{position:relative;width:100%;max-width:320px;background:var(--card);border-radius:22px;padding:22px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px}
.hrowb{width:100%;text-align:start;cursor:pointer}
.recimg{display:block;width:100%;border-radius:14px;overflow:hidden;background:var(--card2)}
.recimg img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
.chip svg{flex:none}
.dirtydot{width:8px;height:8px;border-radius:50%;background:var(--o);display:inline-block}
.navbg span{-webkit-mask:none;mask:none}
.fab{top:8px;width:56px;height:56px;margin-left:-28px;box-shadow:0 4px 12px rgba(11,107,168,.28)}
.app.dark .fab{box-shadow:0 4px 14px rgba(125,211,252,.22)}
.navgap{flex:0 0 84px}
.scroll.pickfull{bottom:0!important}
.chip.on .c{background:rgba(255,255,255,.24);color:inherit}
.datebox .in{padding-inline-end:46px}
.about .aby{font-size:12px;color:var(--mute);margin-top:2px}
.chg{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13.5px}
</style>
<style>
/* تشغيل مستقل: ملء الشاشة + منع التكبير والتحديد */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* أعلى الشاشة بلون الصفحة وأسفلها بلون شريط التنقل، فلا يظهر شريط فارغ تحت التطبيق */
body{background:linear-gradient(#EFF2F5 0 50%,#FFFFFF 50% 100%)}
body:has(.app.dark){background:linear-gradient(#0D1014 0 50%,#161B21 50% 100%)}
body:has(.app:not(.dark) .actionbar),body:has(.app:not(.dark) .ob){background:#EFF2F5}
body:has(.app.dark .actionbar),body:has(.app.dark .ob){background:#0D1014}
body:has(.app.dark .splash){background:#0B0A18}
body:has(.app:not(.dark) .splash){background:#F4F2FB}
#root{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;display:flex;justify-content:center}
#root>.app{width:100%!important;max-width:560px;height:100%!important}
@media (min-width:600px){#root>.app{border-inline:1px solid var(--line)}}
input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div class="app {{themeClass}}" dir="{{dir}}" lang="{{langCode}}" style="direction: {{dir}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Almarai', system-ui, sans-serif; transition: background .25s">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div class="scroll homescroll" style="bottom: calc(72px + env(safe-area-inset-bottom)); padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.2">{{homeTitle}}</h1>
      <span class="sb">{{todayText}}</span>
    </div>
    <div style="display: flex; gap: 6px; flex: none">
      <button class="iconbtn themebtn" onClick="{{toggleTheme}}" aria-label="{{themeAria}}"><sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if><sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4"></path></svg></sc-if></button>
      <button class="iconbtn langbtn" onClick="{{toggleLang}}" aria-label="{{L.aLang}}">{{L.langBtn}}</button>
      <button class="iconbtn" onClick="{{openSettings}}" aria-label="{{L.settings}}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4"></path></svg></button>
    </div>
  </div>

  <sc-if value="{{isCars}}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{hasCars}}" hint-placeholder-val="{{ true }}">
      <div class="cstrip" role="group" aria-label="{{L.chooseCar}}">
        <sc-for list="{{carStrip}}" as="cs" hint-placeholder-count="2">
          <button class="ctile {{cs.on}}" onClick="{{cs.pick}}">
            <span class="cthumb">
              <sc-if value="{{cs.hasPhoto}}" hint-placeholder-val="{{ false }}"><img src="{{cs.photo}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
              <sc-if value="{{cs.noPhoto}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16.5V12l2.4-5h11.2L20 12v4.5z M4 12h16 M7 16.5v2 M17 16.5v2"></path></svg></sc-if>
            </span>
            <span class="ctname">{{cs.name}}</span>
            <sc-if value="{{cs.hasAttn}}" hint-placeholder-val="{{ false }}"><span class="ctdot d-{{cs.lv}}"></span></sc-if>
          </button>
        </sc-for>
        <button class="ctile addt" onClick="{{openCarNew}}">
          <span class="cthumb"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span>
          <span class="ctname">{{L.addCarTile}}</span>
        </button>
      </div>
      <div class="panel" style="display: flex; flex-direction: column; gap: 12px">
        <sc-if value="{{car.hasPhoto}}" hint-placeholder-val="{{ false }}">
          <img src="{{car.photo}}" alt="{{car.name}}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 16px; display: block">
        </sc-if>
        <div style="display: flex; align-items: flex-start; gap: 10px">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
            <button class="carpick" onClick="{{openCarList}}" aria-label="{{L.switchCar}}">
              <span style="font-size: 19px; font-weight: 600; line-height: 1.3">{{car.name}}</span>
              <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--acc)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
            </button>
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
              <sc-if value="{{car.hasPlate}}" hint-placeholder-val="{{ true }}"><span class="plate">{{car.plate}}</span></sc-if>
              <sc-if value="{{car.noPlate}}" hint-placeholder-val="{{ false }}"><span class="sb">{{L.noPlate}}</span></sc-if>
              <span class="cap">{{carCountText}}</span>
            </div>
          </div>
          <button class="iconbtn" onClick="{{openCarEdit}}" aria-label="{{L.editCar}}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z M14 6l4 4"></path></svg></button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; direction: ltr; justify-content: center">
          <sc-for list="{{car.digits}}" as="dg" hint-placeholder-count="6"><span class="digit">{{dg.c}}</span></sc-for>
          <span style="font-size: 14px; color: var(--mute); margin-left: 6px">{{L.km}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span class="sb">{{L.updated}} {{car.odoAgo}} · {{car.avgLine}}</span>
          <button class="outline" onClick="{{openOdo}}">{{L.update}}</button>
        </div>
        <sc-if value="{{car.odoDue}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--oS); color: var(--o); font-size: 12.5px">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z M10 20.5h4"></path></svg>
            {{L.odoDueMsg}}
          </div>
        </sc-if>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <h2 class="sec">{{L.attnTitle}} ({{carAttnCount}})</h2>
          <sc-if value="{{hasCarAttn}}" hint-placeholder-val="{{ true }}"><span class="cap">{{carAttnHint}}</span></sc-if>
        </div>
        <sc-if value="{{hasCarAttn}}" hint-placeholder-val="{{ true }}">
          <div class="carousel" dir="{{dir}}" style="direction: {{dir}}">
            <sc-for list="{{carAttn}}" as="a" hint-placeholder-count="2">
              <button class="hcard {{a.solo}}" onClick="{{a.open}}">
                <div style="position: relative; width: 96px; height: 96px; flex: none">
                  <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
                    <circle cx="60" cy="60" r="48" fill="none" stroke="var(--track)" stroke-width="11"></circle>
                    <circle class="rs-{{a.lv}}" cx="60" cy="60" r="48" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="{{a.ringDash}}" transform="{{ringTransform}}"></circle>
                  </svg>
                  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 13px">
                    <span class="tx-{{a.lv}}" style="font-size: 22px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums">{{a.big}}</span>
                    <span class="cap" style="font-size: 10px; line-height: 1.3">{{a.unit}}</span>
                  </div>
                </div>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
                  <span class="cap">{{a.catName}} · {{a.mainName}}</span>
                  <span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{a.name}}</span>
                  <span class="sb tx-{{a.lv}}" style="font-weight: 500">{{a.sub}}</span>
                  <span class="pill p-{{a.lv}}">{{a.lvText}}</span>
                </div>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noCarAttn}}" hint-placeholder-val="{{ false }}">
          <div class="panel" style="display: flex; align-items: center; gap: 12px; padding: 14px">
            <span class="ic" style="color: var(--g)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            <span style="font-size: 14px">{{L.carAllGood}}</span>
          </div>
        </sc-if>
      </div>

      <div class="segs"><sc-for list="{{carSubs}}" as="cs" hint-placeholder-count="3"><button class="seg {{cs.on}}" onClick="{{cs.pick}}">{{cs.label}}</button></sc-for></div>

      <sc-if value="{{subParts}}" hint-placeholder-val="{{ true }}">
        <div class="panel" style="padding: 4px 14px">
          <sc-for list="{{carParts}}" as="it" hint-placeholder-count="4">
            <button class="lrow {{it.flash}}" onClick="{{it.open}}">
              <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
              <span class="mid"><span class="nm">{{it.name}}</span><span style="display: flex; align-items: center; gap: 6px"><span class="ldot d-{{it.lv}}" style="width: 7px; height: 7px"></span><span class="sb">{{it.lvText}} · {{it.mainName}}</span></span></span>
              <span class="val"><span class="b tx-{{it.lv}}">{{it.big}}</span><span class="u">{{it.unit}}</span></span>
            </button>
          </sc-for>
          <sc-if value="{{noParts}}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 4px; color: var(--mute); font-size: 14px; text-align: center">{{L.noParts}}</div></sc-if>
        </div>
      </sc-if>

      <sc-if value="{{subDocs}}" hint-placeholder-val="{{ false }}">
        <div class="panel" style="padding: 4px 14px">
          <sc-for list="{{carDocs}}" as="it" hint-placeholder-count="2">
            <button class="lrow {{it.flash}}" onClick="{{it.open}}">
              <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
              <span class="mid"><span class="nm">{{it.name}}</span><span style="display: flex; align-items: center; gap: 6px"><span class="ldot d-{{it.lv}}" style="width: 7px; height: 7px"></span><span class="sb">{{it.lvText}} · {{it.due}}</span></span></span>
              <span class="val"><span class="b tx-{{it.lv}}">{{it.big}}</span><span class="u">{{it.unit}}</span></span>
            </button>
          </sc-for>
          <sc-if value="{{noCarDocs}}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 4px; color: var(--mute); font-size: 14px; text-align: center">{{L.noCarDocs}}</div></sc-if>
        </div>
      </sc-if>

    </sc-if>
    <sc-if value="{{noCars}}" hint-placeholder-val="{{ false }}">
      <div class="panel" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 16px; text-align: center">
        <span class="ic" style="width: 56px; height: 56px"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16.5V12l2.4-5h11.2L20 12v4.5z M4 12h16 M7 16.5v2 M17 16.5v2"></path></svg></span>
        <span style="font-size: 15px">{{L.noCars}}</span>
        <button class="primary" onClick="{{openCarNew}}">{{L.addFirstCar}}</button>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{isDocs}}" hint-placeholder-val="{{ false }}">
    <label class="search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4-4"></path></svg>
      <input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="{{L.searchPh}}" aria-label="{{L.aSearch}}">
    </label>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <h2 class="sec">{{L.attnTitle}} ({{docAttnCount}})</h2>
        <sc-if value="{{hasDocAttn}}" hint-placeholder-val="{{ true }}"><span class="cap">{{docAttnHint}}</span></sc-if>
      </div>
      <sc-if value="{{hasDocAttn}}" hint-placeholder-val="{{ true }}">
        <div class="carousel" dir="{{dir}}" style="direction: {{dir}}">
          <sc-for list="{{docAttn}}" as="a" hint-placeholder-count="2">
            <button class="hcard {{a.solo}}" onClick="{{a.open}}">
              <div style="position: relative; width: 96px; height: 96px; flex: none">
                <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
                  <circle cx="60" cy="60" r="48" fill="none" stroke="var(--track)" stroke-width="11"></circle>
                  <circle class="rs-{{a.lv}}" cx="60" cy="60" r="48" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="{{a.ringDash}}" transform="{{ringTransform}}"></circle>
                </svg>
                <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 13px">
                  <span class="tx-{{a.lv}}" style="font-size: 22px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums">{{a.big}}</span>
                  <span class="cap" style="font-size: 10px; line-height: 1.3">{{a.unit}}</span>
                </div>
              </div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
                <span class="cap">{{a.catLine}}</span>
                <span style="font-size: 16px; font-weight: 600; line-height: 1.3">{{a.name}}</span>
                <span class="sb tx-{{a.lv}}" style="font-weight: 500">{{a.sub}}</span>
                <span class="pill p-{{a.lv}}">{{a.lvText}}</span>
              </div>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{noDocAttn}}" hint-placeholder-val="{{ false }}">
        <div class="panel" style="display: flex; align-items: center; gap: 12px; padding: 14px">
          <span class="ic" style="color: var(--g)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <span style="font-size: 14px">{{L.allGood}}</span>
        </div>
      </sc-if>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
        <button class="led {{t.on}}" onClick="{{t.pick}}">
          <span class="ldot d-{{t.key}}"></span>
          <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start"><span class="n">{{t.count}}</span><span class="l">{{t.label}}</span></span>
        </button>
      </sc-for>
    </div>
    <div class="chips">
      <sc-for list="{{docChips}}" as="c" hint-placeholder-count="4">
        <button class="chip {{c.on}}" onClick="{{c.pick}}" style="white-space: nowrap">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          {{c.label}}<span class="c">{{c.count}}</span>
        </button>
      </sc-for>
    </div>
    <div class="panel" style="padding: 4px 14px">
      <sc-for list="{{docList}}" as="it" hint-placeholder-count="6">
        <button class="lrow {{it.flash}}" onClick="{{it.open}}">
          <span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
          <span class="mid">
            <span class="nm">{{it.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span class="ldot d-{{it.lv}}" style="width: 7px; height: 7px"></span><span class="sb" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.lvText}} · {{it.catLine}}</span></span>
          </span>
